<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Audience</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot-logo" aria-hidden="true"></span>
      <h1>Argus <span class="muted">Audience Measurement</span></h1>
    </div>
    <div class="status" id="status">
      <span class="feed-dot" id="feedDot"></span>
      <span id="feedLabel">connecting…</span>
      <span class="sep">·</span>
      <span id="devLabel" class="muted">—</span>
    </div>
  </header>

  <main>
    <!-- Primary view: video left, data right, matched height -->
    <section class="stage-row">
      <!-- Live frame + overlay -->
      <section class="panel hero" aria-label="Live view">
        <div class="panel-head"><h2>Live</h2><span class="hint" id="fpsHint">— fps</span></div>
        <div class="stage" id="stage">
          <img id="video" alt="Live video stream" src="/video">
          <canvas id="overlay"></canvas>
        </div>
      </section>

      <!-- Data column: 6 tiles + two history graphs, scaled to the video height -->
      <section class="data-col">
        <section class="kpis" aria-label="Key metrics">
          <div class="tile"><span class="k-label">Present Now</span><span class="k-val" id="kPeople">0</span></div>
          <div class="tile"><span class="k-label">Gazing Now</span><span class="k-val" id="kGaze">0</span></div>
          <div class="tile"><span class="k-label">Attention Rate</span><span class="k-val" id="kRate">0%</span></div>
          <div class="tile"><span class="k-label">Avg Dwell</span><span class="k-val" id="kDwell">0s</span></div>
          <div class="tile"><span class="k-label">Peak Today</span><span class="k-val" id="kPeak">0</span></div>
          <div class="tile"><span class="k-label">NPU Load</span><span class="k-val" id="kNpu">0%</span></div>
        </section>

        <section class="panel hist" aria-label="Presence history">
          <div class="panel-head"><h2>Presence History</h2><span class="hint">last 60s</span></div>
          <canvas id="timelinePresent" class="chart"></canvas>
        </section>

        <section class="panel hist" aria-label="Gaze history">
          <div class="panel-head"><h2>Gaze History</h2><span class="hint">last 60s</span></div>
          <canvas id="timelineGazing" class="chart"></canvas>
        </section>
      </section>
    </section>

    <!-- Secondary band -->
    <section class="secondary">
      <section class="panel" aria-label="Attention funnel">
        <div class="panel-head"><h2>Attention funnel</h2><span class="hint">live</span></div>
        <canvas id="funnel" class="chart"></canvas>
      </section>
      <section class="panel" aria-label="Dwell distribution">
        <div class="panel-head"><h2>Dwell distribution</h2><span class="hint" id="dwellN">0 visits</span></div>
        <canvas id="dwell" class="chart"></canvas>
      </section>
      <section class="panel" aria-label="Position heatmap">
        <div class="panel-head"><h2>Position heatmap</h2><span class="hint">where people linger</span></div>
        <canvas id="heatmap" class="chart tall"></canvas>
      </section>
    </section>
  </main>

  <div class="tooltip" id="tooltip" hidden></div>

  <script src="vendor/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
